<svg xmlns="http://www.w3.org/2000/svg" width="1940" height="1600" viewBox="0 0 1940 1600" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ tuần tự UC12.4 – Cập nhật trạng thái xử lý đơn</title>
  <desc id="desc">Seller xem đơn và gửi thao tác ship, complete hoặc cancel qua OrderActionServlet. OrderServiceImpl kiểm tra trạng thái và cập nhật MySQL. Scheduler tự hoàn tất đơn giao quá ba ngày.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#263445"/></marker>
    <marker id="retArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#667085"/></marker>
    <style>
      text{font-family:Arial,'Segoe UI',sans-serif;fill:#17212f}.title{font-size:27px;font-weight:700}.subtitle{font-size:15px;fill:#526174}.head{font-size:13px;font-weight:600}.msg{font-size:11px}.small{font-size:11px;fill:#465467}.frameLabel{font-size:12px;font-weight:700;fill:#344054}.life{stroke:#9aa7b5;stroke-width:1.1;stroke-dasharray:6 6}.call{stroke:#263445;stroke-width:1.35;fill:none;marker-end:url(#arrow)}.ret{stroke:#667085;stroke-width:1.2;stroke-dasharray:6 4;fill:none;marker-end:url(#retArrow)}.act{fill:#d9e8f7;stroke:#58718e;stroke-width:1}.frame{fill:#fbfcfe;stroke:#7b8795;stroke-width:1.1}.alert{fill:#fff7f6;stroke:#c77b72;stroke-width:1.1}.sep{stroke:#9aa7b5;stroke-width:1;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1940" height="1600" fill="#fff"/>
  <text x="45" y="42" class="title">Sơ đồ tuần tự UC12.4 – Cập nhật trạng thái xử lý đơn</text>
  <text x="45" y="67" class="subtitle">Luồng Seller/Admin, cập nhật JDBC và tác vụ tự hoàn tất đơn giao quá hạn theo code hiện tại</text>
  <g text-anchor="middle">
    <circle cx="80" cy="96" r="7" fill="none" stroke="#263445" stroke-width="1.4"/><path d="M80 103 V119 M68 109 H92 M80 119 L70 130 M80 119 L90 130" fill="none" stroke="#263445" stroke-width="1.4"/><text x="80" y="148" class="head">Seller/Admin</text>
    <rect x="205" y="88" width="110" height="42" rx="5" fill="#f0f4f8" stroke="#718096"/><text x="260" y="114" class="head">:Browser</text>
    <rect x="380" y="82" width="160" height="54" rx="5" fill="#e8f1fb" stroke="#597796"/><text x="460" y="105" class="head">:OrdersServlet</text><text x="460" y="124" class="small">/orders</text>
    <rect x="590" y="82" width="160" height="54" rx="5" fill="#e8f1fb" stroke="#597796"/><text x="670" y="105" class="head">:OrderActionServlet</text><text x="670" y="124" class="small">/orders-action</text>
    <rect x="840" y="82" width="180" height="54" rx="5" fill="#e8f1fb" stroke="#597796"/><text x="930" y="105" class="head">:OrderServiceImpl</text><text x="930" y="124" class="small">JDBC trực tiếp</text>
    <rect x="1130" y="88" width="120" height="42" rx="5" fill="#f0f4f8" stroke="#718096"/><text x="1190" y="114" class="head">:MySQL</text>
    <rect x="1350" y="82" width="160" height="54" rx="5" fill="#f0f4f8" stroke="#718096"/><text x="1430" y="105" class="head">:OrderScheduler</text><text x="1430" y="124" class="small">Listener</text>
    <rect x="1575" y="82" width="160" height="54" rx="5" fill="#e8f1fb" stroke="#597796"/><text x="1655" y="105" class="head">:OrderEmailService</text><text x="1655" y="124" class="small">ExecutorService</text>
    <rect x="1810" y="88" width="90" height="42" rx="5" fill="#fff4df" stroke="#b38a3d"/><text x="1855" y="114" class="head">:SMTP</text>
  </g>
  <g class="life"><line x1="80" y1="150" x2="80" y2="1450"/><line x1="260" y1="130" x2="260" y2="1450"/><line x1="460" y1="136" x2="460" y2="1450"/><line x1="670" y1="136" x2="670" y2="1450"/><line x1="930" y1="136" x2="930" y2="1450"/><line x1="1190" y1="130" x2="1190" y2="1450"/><line x1="1430" y1="136" x2="1430" y2="1450"/><line x1="1655" y1="136" x2="1655" y2="1450"/><line x1="1855" y1="130" x2="1855" y2="1450"/></g>
  <rect x="454" y="180" width="12" height="300" class="act"/><rect x="664" y="526" width="12" height="608" class="act"/><rect x="924" y="625" width="12" height="510" class="act"/><rect x="1184" y="655" width="12" height="448" class="act"/><rect x="1424" y="1205" width="12" height="165" class="act"/><rect x="1649" y="1045" width="12" height="90" class="act"/>

  <!-- Order list -->
  <text x="80" y="174" class="msg">1. Mở danh sách đơn</text><path d="M80 180 H260" class="call"/>
  <text x="260" y="201" class="msg">2. GET /orders</text><path d="M260 207 H460" class="call"/>
  <text x="460" y="229" class="msg">3. getAllOrders(status, page, pageSize)</text><path d="M460 235 H930" class="call"/>
  <text x="930" y="254" class="msg">4. SELECT orders + details</text><path d="M930 260 H1190" class="call"/>
  <text x="1190" y="279" class="msg">Danh sách đơn</text><path d="M1190 285 H930" class="ret"/>
  <text x="930" y="304" class="msg">List&lt;Order&gt;</text><path d="M930 310 H460" class="ret"/>
  <text x="460" y="333" class="msg">5. Render thao tác theo trạng thái đơn</text><path d="M460 339 H260" class="ret"/>
  <text x="260" y="361" class="msg">Nút ship / complete / cancel</text><path d="M260 367 H80" class="ret"/>
  <text x="80" y="397" class="msg">6. Chọn thao tác và gửi orderId</text><path d="M80 403 H260" class="call"/>
  <text x="260" y="425" class="msg">7. POST /orders-action(action, orderId, reason)</text><path d="M260 431 H670" class="call"/>
  <text x="670" y="454" class="msg">8. Kiểm tra role Seller, action, orderId</text><path d="M670 460 H670 V472 H670" class="call"/>
  <text x="670" y="498" class="msg">9. updateOrderStatusBySeller(orderId, target, reason)</text><path d="M670 504 H930" class="call"/>
  <text x="930" y="527" class="msg">10. getOrderById(orderId)</text><path d="M930 533 H1190" class="call"/>
  <text x="1190" y="552" class="msg">Order + chi tiết đơn</text><path d="M1190 558 H930" class="ret"/>

  <!-- Status branches -->
  <rect x="810" y="585" width="1080" height="535" rx="2" class="frame"/>
  <text x="825" y="607" class="frameLabel">alt [hành động và trạng thái hiện tại hợp lệ]</text>
  <text x="850" y="636" class="frameLabel">[CONFIRMED → SHIPPING, action=ship]</text>
  <text x="930" y="660" class="msg">11. Kiểm tra order.status = CONFIRMED</text><path d="M930 666 H970 V678 H930" class="call"/>
  <text x="930" y="705" class="msg">12. UPDATE orders SET SHIPPING, shipped_at=NOW() WHERE status=CONFIRMED</text><path d="M930 711 H1190" class="call"/>
  <text x="1190" y="730" class="msg">Số dòng cập nhật</text><path d="M1190 736 H930" class="ret"/>
  <line x1="825" y1="755" x2="1875" y2="755" class="sep"/>
  <text x="850" y="778" class="frameLabel">[SHIPPING → COMPLETED, action=complete]</text>
  <text x="930" y="802" class="msg">13. Kiểm tra order.status = SHIPPING</text><path d="M930 808 H970 V820 H930" class="call"/>
  <text x="930" y="847" class="msg">14. UPDATE orders SET COMPLETED WHERE status=SHIPPING</text><path d="M930 853 H1190" class="call"/>
  <text x="1190" y="872" class="msg">Số dòng cập nhật</text><path d="M1190 878 H930" class="ret"/>
  <line x1="825" y1="895" x2="1875" y2="895" class="sep"/>
  <text x="850" y="918" class="frameLabel">[PENDING/CONFIRMED → CANCELLED, action=cancel]</text>
  <text x="930" y="942" class="msg">15. Kiểm tra trạng thái cho phép hủy; setAutoCommit(false)</text><path d="M930 948 H970 V960 H930" class="call"/>
  <text x="930" y="987" class="msg">16. UPDATE orders SET CANCELLED, cancelled_by, reason, cancelled_at</text><path d="M930 993 H1190" class="call"/>
  <text x="930" y="1020" class="msg">17. UPDATE books SET quantity = quantity + số lượng (mỗi OrderDetail)</text><path d="M930 1026 H1190" class="call"/>
  <text x="930" y="1053" class="msg">18. COMMIT; enqueue sendOrderCancelledEmail(...)</text><path d="M930 1059 H1190" class="call"/>
  <path d="M930 1080 H1655" class="call"/><text x="1655" y="1074" class="msg">Email xếp vào worker nền</text>
  <text x="930" y="1104" class="small">else [UPDATE ảnh hưởng 0 dòng]: ROLLBACK, trả false</text>

  <text x="670" y="1153" class="msg">19. Nhận true/false hoặc StoreException</text><path d="M930 1159 H670" class="ret"/>
  <text x="670" y="1182" class="msg">20. sendResponse(success, message, redirectUrl)</text><path d="M670 1188 H670 V1200 H670" class="call"/>
  <text x="670" y="1227" class="msg">Redirect /orders?status=... hoặc JSON</text><path d="M670 1233 H260" class="ret"/>
  <text x="260" y="1255" class="msg">Kết quả thao tác</text><path d="M260 1261 H80" class="ret"/>

  <!-- Scheduled auto completion -->
  <rect x="1335" y="1285" width="570" height="175" rx="2" class="frame"/>
  <text x="1350" y="1307" class="frameLabel">loop [khởi động sau 1 phút, mỗi 30 phút]</text>
  <text x="1430" y="1334" class="msg">21. checkAndAutoCompleteOrders()</text><path d="M1430 1340 H930" class="call"/>
  <text x="930" y="1362" class="msg">22. UPDATE orders SET COMPLETED</text><path d="M930 1368 H1190" class="call"/>
  <text x="1190" y="1387" class="msg">WHERE SHIPPING, shipped_at ≤ NOW() − 3 days</text><path d="M1190 1393 H1430" class="ret"/>
  <text x="1430" y="1415" class="msg">Số đơn đã cập nhật; không gửi thông báo</text>

  <rect x="45" y="1475" width="1850" height="105" rx="5" class="alert"/>
  <text x="64" y="1500" class="frameLabel">Đối chiếu với yêu cầu UC12.4</text>
  <line x1="64" y1="1510" x2="1875" y2="1510" class="sep"/>
  <text x="68" y="1532" class="small">Code hiện còn action confirm PENDING→CONFIRMED; theo thiết kế, xác nhận thanh toán thuộc UC06.4 qua PayOS.</text>
  <text x="68" y="1555" class="small">Hủy PENDING hiện cũng hoàn tồn dù tồn chưa bị trừ; chỉ nên hoàn kho khi hủy đơn đã bị trừ tồn. Gửi thông báo ship/complete chưa có.</text>
</svg>
