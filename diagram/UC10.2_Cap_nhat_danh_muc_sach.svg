<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1460" viewBox="0 0 1660 1460" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ tuần tự UC10.2 – Cập nhật danh mục sách</title>
  <desc id="desc">Quản trị viên xem kho sách, chọn cập nhật một đầu sách, servlet tải dữ liệu theo barcode, hiển thị biểu mẫu rồi lưu name, author, price và quantity qua BookServiceImpl vào MySQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#263445"/></marker>
    <marker id="retArrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#667085"/></marker>
    <style>
      text{font-family:Arial,'Segoe UI',sans-serif;fill:#17212f}.title{font-size:27px;font-weight:700}.subtitle{font-size:15px;fill:#526174}.head{font-size:14px;font-weight:600}.msg{font-size:12px}.small{font-size:11px;fill:#465467}.frameLabel{font-size:12px;font-weight:700;fill:#344054}.life{stroke:#9aa7b5;stroke-width:1.2;stroke-dasharray:6 6}.call{stroke:#263445;stroke-width:1.5;fill:none;marker-end:url(#arrow)}.ret{stroke:#667085;stroke-width:1.3;stroke-dasharray:6 4;fill:none;marker-end:url(#retArrow)}.act{fill:#d9e8f7;stroke:#58718e;stroke-width:1}.frame{fill:#fbfcfe;stroke:#7b8795;stroke-width:1.1}.tag{fill:#fff7f6;stroke:#c77b72;stroke-width:1.1}.sep{stroke:#9aa7b5;stroke-width:1;stroke-dasharray:5 4}
    </style>
  </defs>
  <rect width="1660" height="1460" fill="#fff"/>
  <text x="45" y="42" class="title">Sơ đồ tuần tự UC10.2 – Cập nhật danh mục sách</text>
  <text x="45" y="67" class="subtitle">Luồng cập nhật đầu sách theo servlet và dịch vụ JDBC hiện có</text>
  <g text-anchor="middle">
    <circle cx="80" cy="96" r="7" fill="none" stroke="#263445" stroke-width="1.4"/><path d="M80 103 V119 M68 109 H92 M80 119 L70 130 M80 119 L90 130" fill="none" stroke="#263445" stroke-width="1.4"/><text x="80" y="148" class="head">Seller/Admin</text>
    <rect x="195" y="88" width="130" height="42" rx="5" fill="#f0f4f8" stroke="#718096"/><text x="260" y="114" class="head">:Browser</text>
    <rect x="365" y="82" width="170" height="54" rx="5" fill="#e8f1fb" stroke="#597796"/><text x="450" y="105" class="head">:StoreBookServlet</text><text x="450" y="124" class="small">/storebooks</text>
    <rect x="585" y="88" width="130" height="42" rx="5" fill="#f0f4f8" stroke="#718096"/><text x="650" y="114" class="head">:StoreUtil</text>
    <rect x="765" y="88" width="130" height="42" rx="5" fill="#f0f4f8" stroke="#718096"/><text x="830" y="114" class="head">:HttpSession</text>
    <rect x="930" y="82" width="180" height="54" rx="5" fill="#e8f1fb" stroke="#597796"/><text x="1020" y="105" class="head">:UpdateBookServlet</text><text x="1020" y="124" class="small">/updatebook</text>
    <rect x="1150" y="82" width="180" height="54" rx="5" fill="#e8f1fb" stroke="#597796"/><text x="1240" y="105" class="head">:BookServiceImpl</text><text x="1240" y="124" class="small">(JDBC trực tiếp)</text>
    <rect x="1420" y="88" width="120" height="42" rx="5" fill="#f0f4f8" stroke="#718096"/><text x="1480" y="114" class="head">:MySQL</text>
  </g>
  <g class="life"><line x1="80" y1="150" x2="80" y2="1340"/><line x1="260" y1="130" x2="260" y2="1340"/><line x1="450" y1="136" x2="450" y2="1340"/><line x1="650" y1="130" x2="650" y2="1340"/><line x1="830" y1="130" x2="830" y2="1340"/><line x1="1020" y1="136" x2="1020" y2="1340"/><line x1="1240" y1="136" x2="1240" y2="1340"/><line x1="1480" y1="130" x2="1480" y2="1340"/></g>
  <rect x="444" y="176" width="12" height="340" class="act"/><rect x="644" y="221" width="12" height="55" class="act"/><rect x="824" y="235" width="12" height="30" class="act"/><rect x="1014" y="597" width="12" height="657" class="act"/><rect x="1234" y="347" width="12" height="119" class="act"/><rect x="1234" y="803" width="12" height="247" class="act"/><rect x="1474" y="365" width="12" height="89" class="act"/><rect x="1474" y="821" width="12" height="201" class="act"/>
  <!-- Browse catalog -->
  <text x="80" y="174" class="msg">1. Mở kho sách</text><path d="M80 180 H260" class="call"/>
  <text x="260" y="201" class="msg">2. GET /storebooks</text><path d="M260 207 H450" class="call"/>
  <text x="450" y="229" class="msg">3. isLoggedIn(SELLER, session)</text><path d="M450 235 H650" class="call"/>
  <text x="650" y="253" class="msg">4. Đọc vai trò</text><path d="M650 259 H830" class="call"/>
  <text x="830" y="278" class="msg">Vai trò</text><path d="M830 284 H650" class="ret"/>
  <text x="650" y="302" class="msg">Kết quả xác thực</text><path d="M650 308 H450" class="ret"/>
  <text x="450" y="330" class="msg">5. getBookCount()</text><path d="M450 336 H1240" class="call"/>
  <text x="1240" y="354" class="msg">6. SELECT COUNT(*) FROM books</text><path d="M1240 360 H1480" class="call"/>
  <text x="1480" y="379" class="msg">totalBooks</text><path d="M1480 385 H1240" class="ret"/>
  <text x="450" y="405" class="msg">7. getBooksPage(page, 12)</text><path d="M450 411 H1240" class="call"/>
  <text x="1240" y="430" class="msg">8. SELECT books ORDER BY name LIMIT/OFFSET</text><path d="M1240 436 H1480" class="call"/>
  <text x="1480" y="455" class="msg">List&lt;Book&gt;</text><path d="M1480 461 H1240" class="ret"/>
  <text x="1240" y="481" class="msg">Danh sách theo trang</text><path d="M1240 487 H450" class="ret"/>
  <text x="450" y="510" class="msg">9. Render bảng kho sách và nút Cập nhật</text><path d="M450 516 H260" class="ret"/>
  <text x="260" y="537" class="msg">Danh sách sách</text><path d="M260 543 H80" class="ret"/>
  <!-- Load book and form -->
  <text x="80" y="573" class="msg">10. Chọn Cập nhật</text><path d="M80 579 H260" class="call"/>
  <text x="260" y="600" class="msg">11. POST /updatebook (bookId = barcode)</text><path d="M260 606 H1020" class="call"/>
  <text x="1020" y="628" class="msg">12. Kiểm tra StoreUtil.isLoggedIn(SELLER)</text><path d="M1020 634 H650" class="call"/>
  <text x="650" y="653" class="msg">Kiểm tra role phiên</text><path d="M650 659 H830" class="call"/>
  <text x="830" y="678" class="msg">Vai trò</text><path d="M830 684 H650" class="ret"/>
  <text x="650" y="702" class="msg">Có quyền</text><path d="M650 708 H1020" class="ret"/>
  <text x="1020" y="730" class="msg">13. getBookById(bookId)</text><path d="M1020 736 H1240" class="call"/>
  <text x="1240" y="755" class="msg">14. SELECT * FROM books WHERE barcode = ?</text><path d="M1240 761 H1480" class="call"/>
  <text x="1480" y="780" class="msg">Thông tin sách</text><path d="M1480 786 H1240" class="ret"/>
  <text x="1240" y="806" class="msg">Book</text><path d="M1240 812 H1020" class="ret"/>
  <text x="1020" y="834" class="msg">15. Hiển thị form (barcode readonly)</text><path d="M1020 840 H260" class="ret"/>
  <text x="260" y="862" class="msg">Form name, author, price, quantity</text><path d="M260 868 H80" class="ret"/>
  <!-- Submit update -->
  <text x="80" y="898" class="msg">16. Sửa thông tin và lưu</text><path d="M80 904 H260" class="call"/>
  <text x="260" y="925" class="msg">17. POST /updatebook (updateFormSubmitted, fields)</text><path d="M260 931 H1020" class="call"/>
  <text x="1020" y="953" class="msg">18. Parse price/quantity, tạo Book</text><path d="M1020 959 H1060 V971 H1020" class="call"/>
  <text x="1020" y="982" class="msg">19. updateBook(book)</text><path d="M1020 988 H1240" class="call"/>
  <text x="1240" y="1007" class="msg">20. UPDATE books SET name, author, price, quantity WHERE barcode = ?</text><path d="M1240 1013 H1480" class="call"/>
  <text x="1480" y="1032" class="msg">executeUpdate result</text><path d="M1480 1038 H1240" class="ret"/>
  <text x="1240" y="1058" class="msg">SUCCESS / FAILURE</text><path d="M1240 1064 H1020" class="ret"/>
  <text x="1020" y="1087" class="msg">21. Hiển thị thông báo cập nhật</text><path d="M1020 1093 H260" class="ret"/>
  <text x="260" y="1115" class="msg">Kết quả + liên kết về kho sách</text><path d="M260 1121 H80" class="ret"/>
  <text x="80" y="1144" class="msg">22. Xem kết quả</text>
  <!-- Important branches -->
  <rect x="45" y="1180" width="1550" height="145" rx="5" class="tag"/>
  <text x="64" y="1205" class="frameLabel">Các nhánh thay thế / lỗi quan trọng</text>
  <line x1="64" y1="1215" x2="1575" y2="1215" class="sep"/>
  <text x="68" y="1240" class="small">[Không có quyền Seller] StoreBookServlet/UpdateBookServlet hiển thị SellerLogin.html và thông báo đăng nhập quản trị.</text>
  <text x="68" y="1264" class="small">[Không tìm thấy sách] getBookById trả null; quá trình hiển thị form lỗi và UpdateBookServlet báo tải thông tin sách thất bại.</text>
  <text x="68" y="1288" class="small">[Lỗi parse hoặc cập nhật] Servlet hiển thị lỗi; updateBook trả FAILURE khi có exception SQL.</text>
  <text x="68" y="1312" class="small">[executeUpdate = 0] Code vẫn đặt responseCode = SUCCESS; hiện chưa xác minh bản ghi có thực sự được cập nhật.</text>
  <text x="45" y="1375" class="small">Phạm vi hình: cập nhật thông tin sách. Thêm sách/nhập tệp đi qua AddBookServlet; gỡ sách đi qua RemoveBookServlet.</text>
  <text x="45" y="1398" class="small">Thiết kế mở rộng category_id, publisher, image_url, description và INACTIVE chưa được xem là luồng đã có trong code.</text>
</svg>
