<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1600" viewBox="0 0 2000 1600" role="img" aria-labelledby="title desc">
  <title id="title">Sơ đồ lớp nghiệp vụ hệ thống quản lý mua bán sách</title>
  <desc id="desc">Sơ đồ UML của các lớp nghiệp vụ cốt lõi: người dùng, danh mục, sách, giỏ hàng, đơn hàng, thanh toán, ký gửi sách cũ, Book Coins, thông báo và nhật ký quản trị.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
    <style>
      .bg{fill:#f8fafc}.title{font:700 32px Arial,sans-serif;fill:#0f172a}.sub{font:18px Arial,sans-serif;fill:#475569}.hdr{fill:#dbeafe;stroke:#1e3a5f;stroke-width:2}.planned .hdr{fill:#fef3c7}.enum .hdr{fill:#ede9fe}.body{fill:#ffffff;stroke:#1e3a5f;stroke-width:2}.split{stroke:#1e3a5f;stroke-width:1.4}.cls{font:700 21px Arial,sans-serif;fill:#0f172a}.stereo{font:italic 15px Arial,sans-serif;fill:#475569}.txt{font:16px Consolas,'Courier New',monospace;fill:#1e293b}.rel{fill:none;stroke:#334155;stroke-width:2.2}.dep{fill:none;stroke:#334155;stroke-width:2.2;stroke-dasharray:8 6}.label{font:italic 15px Arial,sans-serif;fill:#334155}.multi{font:700 15px Arial,sans-serif;fill:#0f172a}.note{font:16px Arial,sans-serif;fill:#334155}
    </style>
  </defs>
  <rect class="bg" width="2000" height="1600"/>
  <text x="1000" y="55" text-anchor="middle" class="title">Hình 3.1. Sơ đồ lớp nghiệp vụ của hệ thống quản lý mua bán sách</text>
  <text x="1000" y="85" text-anchor="middle" class="sub">Nhóm Tài khoản · Danh mục và bán hàng · Thanh toán · Các chức năng mở rộng</text>
  <rect x="70" y="108" width="20" height="20" fill="#dbeafe" stroke="#1e3a5f"/><text x="101" y="125" class="note">Lớp hiện có trong mã nguồn</text>
  <rect x="360" y="108" width="20" height="20" fill="#fef3c7" stroke="#1e3a5f"/><text x="391" y="125" class="note">Lớp thiết kế bổ sung</text>
  <line x1="650" y1="118" x2="698" y2="118" class="rel"/><text x="708" y="125" class="note">Association</text>
  <line x1="910" y1="118" x2="958" y2="118" class="dep" marker-end="url(#arrow)"/><text x="968" y="125" class="note">Dependency</text>
  <polygon points="1210,118 1222,106 1234,118 1222,130" fill="#334155"/><text x="1245" y="125" class="note">Composition</text>

  <!-- Relationships: placed behind class boxes -->
  <path d="M200 410 L200 490" class="rel" marker-end="url(#arrow)"/><text x="212" y="452" class="label">is assigned</text><text x="212" y="478" class="multi">1..*</text>
  <path d="M330 310 L420 310" class="rel" marker-end="url(#arrow)"/><text x="345" y="299" class="multi">1</text><text x="390" y="299" class="multi">0..*</text><text x="350" y="335" class="label">owns</text>
  <path d="M640 335 L700 335 L700 435 L760 435" class="rel" marker-end="url(#arrow)"/><text x="680" y="425" class="label">stores</text><text x="728" y="424" class="multi">1</text>
  <path d="M900 295 L900 355" class="rel" marker-end="url(#arrow)"/><text x="912" y="330" class="label">classifies</text><text x="912" y="348" class="multi">0..*</text>
  <path d="M250 410 L250 800 L420 800" class="rel" marker-end="url(#arrow)"/><text x="263" y="620" class="label">places</text><text x="390" y="786" class="multi">0..*</text>
  <path d="M700 800 L770 800" class="rel"/><polygon points="715,800 729,786 743,800 729,814" fill="#334155"/><text x="705" y="782" class="multi">1</text><text x="745" y="782" class="multi">1..*</text><text x="708" y="830" class="label">consists of</text>
  <path d="M895 710 L895 600" class="rel" marker-end="url(#arrow)"/><text x="907" y="666" class="label">refers to</text><text x="907" y="689" class="multi">1</text>
  <path d="M700 850 L730 850 L730 930 L1270 930 L1270 905" class="rel"/><polygon points="715,850 729,836 743,850 729,864" fill="#334155"/><text x="950" y="920" class="label">has</text><text x="1240" y="920" class="multi">0..1</text>
  <path d="M160 410 L160 1030" class="rel" marker-end="url(#arrow)"/><text x="172" y="750" class="label">consigns</text><text x="172" y="1015" class="multi">0..*</text>
  <path d="M330 385 L360 385 L360 1200 L500 1200" class="rel" marker-end="url(#arrow)"/><text x="372" y="820" class="label">owns</text><text x="465" y="1185" class="multi">0..1</text>
  <path d="M745 1195 L840 1195" class="rel"/><polygon points="760,1195 774,1181 788,1195 774,1209" fill="#334155"/><text x="752" y="1178" class="multi">1</text><text x="810" y="1178" class="multi">0..*</text><text x="758" y="1225" class="label">records</text>
  <path d="M380 1080 L965 1080 L965 1120" class="dep" marker-end="url(#arrow)"/><text x="585" y="1070" class="label">creates when SOLD</text>
  <path d="M200 180 L200 145 L1470 145 L1470 1050 L1318 1050 L1318 1080" class="rel" marker-end="url(#arrow)"/><text x="895" y="137" class="label">receives</text><text x="1330" y="1064" class="multi">0..*</text>
  <path d="M70 345 L45 345 L45 1470 L1678 1470 L1678 1260" class="rel" marker-end="url(#arrow)"/><text x="925" y="1460" class="label">performs</text><text x="1642" y="1455" class="multi">0..*</text>
  <path d="M1040 460 L1100 460" class="rel" marker-end="url(#arrow)"/><text x="1052" y="450" class="multi">1</text>
  <path d="M560 920 L560 970" class="rel" marker-end="url(#arrow)"/><text x="572" y="952" class="multi">1</text>
  <path d="M1270 905 L1270 930" class="rel" marker-end="url(#arrow)"/><text x="1282" y="922" class="multi">1</text>
  <path d="M230 1285 L230 1340" class="rel" marker-end="url(#arrow)"/><text x="242" y="1326" class="multi">1</text>

  <!-- Account and catalogue -->
  <g transform="translate(70,180)">
    <rect class="hdr" width="260" height="48"/><rect class="body" y="48" width="260" height="182"/><line class="split" y1="48" x2="260" y2="48"/><line class="split" y1="160" x2="260" y2="160"/>
    <text x="130" y="31" text-anchor="middle" class="cls">User</text><text x="15" y="75" class="txt">- username: String</text><text x="15" y="98" class="txt">- emailId: String</text><text x="15" y="121" class="txt">- password: String</text><text x="15" y="144" class="txt">- firstName, lastName</text><text x="15" y="184" class="txt">+ getUsername(): String</text><text x="15" y="208" class="txt">+ getRoles(): List</text>
  </g>
  <g transform="translate(110,490)" class="enum">
    <rect class="hdr" width="180" height="48"/><rect class="body" y="48" width="180" height="120"/><line class="split" y1="48" x2="180" y2="48"/>
    <text x="90" y="19" text-anchor="middle" class="stereo">«enumeration»</text><text x="90" y="39" text-anchor="middle" class="cls">UserRole</text><text x="15" y="78" class="txt">CUSTOMER</text><text x="15" y="104" class="txt">SELLER_ADMIN</text>
  </g>
  <g transform="translate(420,260)">
    <rect class="hdr" width="220" height="48"/><rect class="body" y="48" width="220" height="150"/><line class="split" y1="48" x2="220" y2="48"/><line class="split" y1="108" x2="220" y2="108"/>
    <text x="110" y="31" text-anchor="middle" class="cls">Cart</text><text x="15" y="78" class="txt">- quantity: int</text><text x="15" y="133" class="txt">+ changeQuantity()</text><text x="15" y="157" class="txt">  : void</text>
  </g>
  <g transform="translate(780,155)" class="planned">
    <rect class="hdr" width="240" height="48"/><rect class="body" y="48" width="240" height="140"/><line class="split" y1="48" x2="240" y2="48"/>
    <text x="120" y="19" text-anchor="middle" class="stereo">«planned»</text><text x="120" y="39" text-anchor="middle" class="cls">Category</text><text x="15" y="77" class="txt">- id: Long</text><text x="15" y="101" class="txt">- name: String</text><text x="15" y="125" class="txt">- active: boolean</text>
  </g>
  <g transform="translate(760,355)">
    <rect class="hdr" width="280" height="48"/><rect class="body" y="48" width="280" height="245"/><line class="split" y1="48" x2="280" y2="48"/><line class="split" y1="203" x2="280" y2="203"/>
    <text x="140" y="31" text-anchor="middle" class="cls">Book</text><text x="15" y="76" class="txt">- barcode: String</text><text x="15" y="100" class="txt">- name: String</text><text x="15" y="124" class="txt">- author: String</text><text x="15" y="148" class="txt">- price: decimal</text><text x="15" y="172" class="txt">- quantity: int</text><text x="15" y="196" class="txt">- status: BookStatus</text><text x="15" y="229" class="txt">+ changeStatus(): void</text>
  </g>
  <g transform="translate(1100,190)" class="enum">
    <rect class="hdr" width="190" height="48"/><rect class="body" y="48" width="190" height="115"/><line class="split" y1="48" x2="190" y2="48"/>
    <text x="95" y="19" text-anchor="middle" class="stereo">«enumeration»</text><text x="95" y="39" text-anchor="middle" class="cls">BookStatus</text><text x="15" y="78" class="txt">ACTIVE</text><text x="15" y="103" class="txt">INACTIVE</text>
  </g>

  <!-- Order and payment -->
  <g transform="translate(420,670)">
    <rect class="hdr" width="280" height="48"/><rect class="body" y="48" width="280" height="250"/><line class="split" y1="48" x2="280" y2="48"/><line class="split" y1="205" x2="280" y2="205"/>
    <text x="140" y="31" text-anchor="middle" class="cls">Order</text><text x="15" y="76" class="txt">- orderId: String</text><text x="15" y="100" class="txt">- orderCode: Long</text><text x="15" y="124" class="txt">- orderDate: Date</text><text x="15" y="148" class="txt">- totalAmount: decimal</text><text x="15" y="172" class="txt">- status: OrderStatus</text><text x="15" y="196" class="txt">- shippingAddress: String</text><text x="15" y="231" class="txt">+ cancel(reason): void</text><text x="15" y="255" class="txt">+ updateStatus(...): void</text>
  </g>
  <g transform="translate(770,710)">
    <rect class="hdr" width="250" height="48"/><rect class="body" y="48" width="250" height="190"/><line class="split" y1="48" x2="250" y2="48"/>
    <text x="125" y="31" text-anchor="middle" class="cls">OrderDetail</text><text x="15" y="77" class="txt">- id: Long</text><text x="15" y="101" class="txt">- quantity: int</text><text x="15" y="125" class="txt">- unitPrice: decimal</text><text x="15" y="149" class="txt">- amount: decimal</text>
  </g>
  <g transform="translate(1140,715)" class="planned">
    <rect class="hdr" width="260" height="48"/><rect class="body" y="48" width="260" height="190"/><line class="split" y1="48" x2="260" y2="48"/><line class="split" y1="164" x2="260" y2="164"/>
    <text x="130" y="19" text-anchor="middle" class="stereo">«planned»</text><text x="130" y="39" text-anchor="middle" class="cls">Payment</text><text x="15" y="76" class="txt">- id: Long</text><text x="15" y="100" class="txt">- providerTransactionId</text><text x="15" y="124" class="txt">- status: PaymentStatus</text><text x="15" y="148" class="txt">- paidAt: Date</text><text x="15" y="182" class="txt">+ verifyWebhookSignature()</text>
  </g>
  <g transform="translate(420,970)" class="enum">
    <rect class="hdr" width="280" height="48"/><rect class="body" y="48" width="280" height="155"/><line class="split" y1="48" x2="280" y2="48"/>
    <text x="140" y="19" text-anchor="middle" class="stereo">«enumeration»</text><text x="140" y="39" text-anchor="middle" class="cls">OrderStatus</text><text x="15" y="78" class="txt">PENDING, CONFIRMED</text><text x="15" y="102" class="txt">SHIPPING, COMPLETED</text><text x="15" y="126" class="txt">CANCELLED, EXPIRED</text>
  </g>
  <g transform="translate(1140,930)" class="enum">
    <rect class="hdr" width="260" height="48"/><rect class="body" y="48" width="260" height="145"/><line class="split" y1="48" x2="260" y2="48"/>
    <text x="130" y="19" text-anchor="middle" class="stereo">«enumeration»</text><text x="130" y="39" text-anchor="middle" class="cls">PaymentStatus</text><text x="15" y="78" class="txt">PENDING, SUCCESS</text><text x="15" y="102" class="txt">FAILED, EXPIRED</text>
  </g>

  <!-- Extensions -->
  <g transform="translate(80,1030)" class="planned">
    <rect class="hdr" width="300" height="48"/><rect class="body" y="48" width="300" height="255"/><line class="split" y1="48" x2="300" y2="48"/><line class="split" y1="215" x2="300" y2="215"/>
    <text x="150" y="19" text-anchor="middle" class="stereo">«planned»</text><text x="150" y="39" text-anchor="middle" class="cls">UsedBookListing</text><text x="15" y="76" class="txt">- id: Long</text><text x="15" y="100" class="txt">- bookTitle: String</text><text x="15" y="124" class="txt">- resalePrice: decimal</text><text x="15" y="148" class="txt">- conditionPercent: int</text><text x="15" y="172" class="txt">- status: UsedBookStatus</text><text x="15" y="196" class="txt">- reviewedAt: Date</text><text x="15" y="242" class="txt">+ review(): void</text>
  </g>
  <g transform="translate(500,1120)" class="planned">
    <rect class="hdr" width="245" height="48"/><rect class="body" y="48" width="245" height="150"/><line class="split" y1="48" x2="245" y2="48"/><line class="split" y1="111" x2="245" y2="111"/>
    <text x="122" y="19" text-anchor="middle" class="stereo">«planned»</text><text x="122" y="39" text-anchor="middle" class="cls">BookCoinAccount</text><text x="15" y="76" class="txt">- id: Long</text><text x="15" y="100" class="txt">- balance: int</text><text x="15" y="138" class="txt">+ credit(amount): void</text>
  </g>
  <g transform="translate(840,1120)" class="planned">
    <rect class="hdr" width="250" height="48"/><rect class="body" y="48" width="250" height="155"/><line class="split" y1="48" x2="250" y2="48"/>
    <text x="125" y="19" text-anchor="middle" class="stereo">«planned»</text><text x="125" y="39" text-anchor="middle" class="cls">BookCoinTransaction</text><text x="15" y="76" class="txt">- id: Long</text><text x="15" y="100" class="txt">- amount: int</text><text x="15" y="124" class="txt">- reason: String</text><text x="15" y="148" class="txt">- createdAt: Date</text>
  </g>
  <g transform="translate(1190,1080)" class="planned">
    <rect class="hdr" width="255" height="48"/><rect class="body" y="48" width="255" height="180"/><line class="split" y1="48" x2="255" y2="48"/><line class="split" y1="151" x2="255" y2="151"/>
    <text x="127" y="19" text-anchor="middle" class="stereo">«planned»</text><text x="127" y="39" text-anchor="middle" class="cls">Notification</text><text x="15" y="76" class="txt">- id: Long</text><text x="15" y="100" class="txt">- type: String</text><text x="15" y="124" class="txt">- content: String</text><text x="15" y="148" class="txt">- isRead: boolean</text><text x="15" y="170" class="txt">+ markAsRead(): void</text>
  </g>
  <g transform="translate(1540,1080)" class="planned">
    <rect class="hdr" width="275" height="48"/><rect class="body" y="48" width="275" height="180"/><line class="split" y1="48" x2="275" y2="48"/>
    <text x="137" y="19" text-anchor="middle" class="stereo">«planned»</text><text x="137" y="39" text-anchor="middle" class="cls">AdminAuditLog</text><text x="15" y="76" class="txt">- id: Long</text><text x="15" y="100" class="txt">- action: String</text><text x="15" y="124" class="txt">- entityType: String</text><text x="15" y="148" class="txt">- entityId: String</text><text x="15" y="172" class="txt">- createdAt: Date</text>
  </g>
  <g transform="translate(80,1340)" class="enum">
    <rect class="hdr" width="300" height="48"/><rect class="body" y="48" width="300" height="150"/><line class="split" y1="48" x2="300" y2="48"/>
    <text x="150" y="19" text-anchor="middle" class="stereo">«enumeration»</text><text x="150" y="39" text-anchor="middle" class="cls">UsedBookStatus</text><text x="15" y="78" class="txt">PENDING, NEED_MORE_INFO</text><text x="15" y="102" class="txt">APPROVED, REJECTED, SOLD</text>
  </g>
  <text x="80" y="1545" class="note">Chú giải: đường liền là association; hình thoi đen là composition (thành phần phụ thuộc vòng đời vào tổng thể); đường nét đứt là dependency. Bội số nằm sát đầu lớp được mô tả.</text>
  <text x="80" y="1572" class="note">Lớp mang nhãn «planned» là thiết kế mở rộng cần hiện thực, không khẳng định đã tồn tại trong mã nguồn hiện tại.</text>
</svg>
